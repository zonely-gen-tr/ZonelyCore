<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="567" viewBox="0 0 1200 567" role="img" aria-labelledby="title desc">
<title id="title">Mağaza, kredi ve ödüller</title>
<desc id="desc">Web mağazası: Paneldeki kategoriler ve ürünler oyun içinde. Ürün seçenekleri ve paketler: Seçenek, paket, fiyat ve stok yönetimi. Sunucular arası teslimat: Bu sunucuya veya panelde seçilen sunuculara. Kredi yönetimi: Bakiye sorgula, kredi ekle, çıkar veya ayarla. Kredi kuponları: Krediyi eşya olarak oluştur, paylaş ve kullan. Açık artırma: Eşyaları ortak kredi sistemiyle alıp sat. Zamanlı ödüller: Yetki ve bekleme süresine bağlı ödüller. Son kredi yüklemeleri: Son işlemler ve dönemlere göre sıralamalar.</desc>
