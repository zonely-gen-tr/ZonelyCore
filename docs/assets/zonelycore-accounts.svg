<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Account and security</title><desc id="desc">Login and registration with the web account: Use the web account at the game entrance. Auto login: log in according to IP and time conditions. Bossbar redirects: Show the login and verification steps on the screen. Email verification: Address identification and verification emails. Email change: Define new address and complete the verification. Two-factor authentication — TOTP: Authenticator application and recovery codes. Password reset: Renew password via the web with periodic connection. BungeeCord transfer: redirecting to target server after entry. Launcher verification: Zonely with access.</desc><rect width="1200" height="675" fill="#C84B0C"/><g fill="#fff" font-family="Segoe UI,Arial,sans-serif"><g data-feather="shield" transform="translate(52 40) scale(1.5000)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g><text x="106" y="70" font-size="36" font-weight="700">Account and security</text><g data-feather="log-in" transform="translate(52 115) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></g><text x="96" y="139" font-size="24" font-weight="700">Login and registration</text><text x="96" y="173" font-size="20">Use the web account at the gaming entrance.</text><g data-feather="unlock" transform="translate(612 115) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></g><text x="656" y="139" font-size="24" font-weight="700">Automatic input</text><text x="656" y="173" font-size="20">Log in according to IP and time conditions.</text><g data-feather="info" transform="translate(52 223) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></g><text x="96" y="247" font-size="24" font-weight="700">Bossbar guidance</text><text x="96" y="281" font-size="20">Show login and verification steps on screen.</text><g data-feather="mail" transform="translate(612 223) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></g><text x="656" y="247" font-size="24" font-weight="700">Email verification</text><text x="656" y="281" font-size="20">Address identification and verification emails.</text><g data-feather="edit-3" transform="translate(52 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></g><text x="96" y="355" font-size="24" font-weight="700">Change email</text><text x="96" y="389" font-size="20">Define new address and complete verification.</text><g data-feather="key" transform="translate(612 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></g><text x="656" y="355" font-size="24" font-weight="700">Two-factor authentication</text><text x="656" y="389" font-size="20">Authenticator apps and recovery codes.</text><g data-feather="refresh-cw" transform="translate(52 439) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" st