<text x="96" y="497" font-size="20">Süreli bağlantıyla web üzerinden şifre yenile.</text>
<g data-feather="shuffle" transform="translate(612 439) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></g>
<text x="656" y="463" font-size="24" font-weight="700">BungeeCord aktarımı</text>
<text x="656" y="497" font-size="20">Girişten sonra hedef sunucuya yönlendirme.</text>
<g data-feather="check-circle" transform="translate(52 547) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g>
<text x="96" y="571" font-size="24" font-weight="700">Launcher doğrulaması</text>
<text x="96" y="605" font-size="20">ZonelyLauncher oturumu ile erişim kontrolü.</text>
