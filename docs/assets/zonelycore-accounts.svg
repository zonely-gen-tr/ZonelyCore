<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Hesap ve güvenlik</title>
<desc id="desc">Web hesabıyla giriş ve kayıt: Web hesabını oyun girişinde de kullan. Otomatik giriş: IP ve süre koşullarına göre oturum aç. Bossbar yönlendirmeleri: Giriş ve doğrulama adımlarını ekranda göster. E-posta doğrulama: Adres tanımlama ve doğrulama e-postaları. E-posta değiştirme: Yeni adresi tanımla ve doğrulamayı tamamla. İki aşamalı doğrulama — TOTP: Doğrulayıcı uygulama ve kurtarma kodları. Şifre sıfırlama: Süreli bağlantıyla web üzerinden şifre yenile. BungeeCord aktarımı: Girişten sonra hedef sunucuya yönlendirme. Launcher doğrulaması: ZonelyLauncher oturumu ile erişim kontrolü.</desc>
<rect width="1200" height="675" fill="#C84B0C"/>
<g fill="#fff" font-family="Segoe UI,Arial,sans-serif">
<g data-feather="shield" transform="translate(52 40) scale(1.5000)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g>
<text x="106" y="70" font-size="36" font-weight="700">Hesap ve güvenlik</text>
<g data-feather="log-in" transform="translate(52 115) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></g>
<text x="96" y="139" font-size="24" font-weight="700">Giriş ve kayıt</text>
<text x="96" y="173" font-size="20">Web hesabını oyun girişinde de kullan.</text>
<g data-feather="unlock" transform="translate(612 115) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></g>
<text x="656" y="139" font-size="24" font-weight="700">Otomatik giriş</text>
<text x="656" y="173" font-size="20">IP ve süre koşullarına göre oturum aç.</text>
<g data-feather="info" transform="translate(52 223) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></g>
<text x="96" y="247" font-size="24" font-weight="700">Bossbar yönlendirmeleri</text>
<text x="96" y="281" font-size="20">Giriş ve doğrulama adımlarını ekranda göster.</text>
<g data-feather="mail" transform="translate(612 223) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></g>
<text x="656" y="247" font-size="24" font-weight="700">E-posta doğrulama</text>
<text x="656" y="281" font-size="20">Adres tanımlama ve doğrulama e-postaları.</text>
<g data-feather="edit-3" transform="translate(52 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></g>
<text x="96" y="355" font-size="24" font-weight="700">E-posta değiştirme</text>
<text x="96" y="389" font-size="20">Yeni adresi tanımla ve doğrulamayı tamamla.</text>
