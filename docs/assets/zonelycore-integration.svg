<title id="title">Web ve entegrasyonlar</title>
<desc id="desc">Panel komutları / SecureSocket: Panelden oyun sunucusuna komut iletimi. ChatBridge: Web ve oyun sohbeti; çevrimiçi oyuncular. Envanter görüntüleri: Giriş ve çıkış envanterini panelde göster. MySQL / MariaDB ve PlaceholderAPI: Ortak veritabanı ve dinamik yer tutucular. Modüler yapı ve Java API: Modül ayarları ve geliştirici servisleri. GitHub üzerinden güncelleme: /zc update ile doğrulanan JAR indirme.</desc>
