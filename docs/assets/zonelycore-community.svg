<title id="title">Topluluk ve yönetim</title>
<desc id="desc">Arkadaş sistemi: İstek, arkadaş listesi ve özel mesajlar. Canlı destek talepleri: Web ile ortak talepler ve yetkili cevapları. Oyuncu raporları: İhlal bildirimi ve yetkililere özel inceleme. Replay inceleme: Rapor kayıtlarını izleyerek olayı değerlendir. Ceza yönetimi: Ban, IP ban, mute, uyarı ve ceza geçmişi. Sohbet filtreleri: Reklam ve yasaklı kelime filtreleri. Oyuncu analizi ve etkinlik kayıtları: Oyun süresi, sohbet ve komut etkinlikleri.</desc>
