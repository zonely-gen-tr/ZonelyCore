<desc id="desc">Menü açan NPC&#x27;ler: 8 menü türü; özel isim, skin ve hologram. Hologramlar ve kredi sıralamaları: Kredi verileri ve PlaceholderAPI değerleri. Web profili: Hesap, kredi, mağaza ve ödüller tek menüde. Gruplar ve yetkiler: Rol bilgileri ve yetkilere bağlı erişim. Unvanlar, booster ve lig görünümü: Profil menüleri; isteğe bağlı AlonsoLeagues. Sohbet renkleri: Yetkiye göre menüden renk seçimi. Disguise / farklı kimlik: Oyun içinde farklı isim, rol ve skin kullan.</desc>
