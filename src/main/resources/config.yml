# AlonsoLeagues GUI: keep these league identifiers in sync with AlonsoLeagues' leagues.yml
# so the menu can show live data pulled from the PlaceholderAPI expansion.
alonsoleagues:
  progress-bar:
    length: 10
    symbol: "|"
    progress-color: "&b"
    remaining-color: "&7"
  description:
    base:
      - "&8[Level]&e"
      - ""
      - "&fUnlock this tier by winning games,"
      - "&fdefeating opponents and spending time on"
      - "&fthe network."
      - ""
      - "&7 &8-> &fDisplay: {appearance} &f{player}"
    progress:
      - "&7 &8-> &fNeeded XP: &c{current}/{required} {bar}&7 ({percent}%)"
      - ""
      - "&7 &8-> &fStatus: &cIN PROGRESS"
    completed:
      - ""
      - "&7 &8-> &fStatus: &aCOMPLETED"
  levels:
    coal-1:
      slot: 10
      required-points: 0
      icon: "173 : 1"
      name: "&a&lCoal I"
      completed-name: "&a&lCoal I"
      appearance: "&8Coal I"
      glow-on-complete: true

deliveries:
  oyuncugunluk:
    slot: 10
    days: 1
    permission: ""
    icon: "STAINED_CLAY:5 : 1 : name>{color}&lPlayer Daily Reward : desc>&8[REWARD]\\n \\n&fYou can claim this reward again after a short period.\\n \\n&f* Contents:\\n&7 &8-> &6100 Credits\\n"
    message: "&3Lobby &8-> &6Player Daily &eReward collected successfully."
    rewards:
      - "CASH>100"
      - "KOMUT>wmb ver {name} 17"
# Integration Quick Reference (BetterSocial, ChatColor, AlonsoLeagues)
# BetterSocial + ChatColor:
#   1. Install BetterSocial and ChatColor+ alongside PlaceholderAPI so their placeholders work in menus and chat.
#   2. Grant the permissions you want per group (e.g. bettersocial.edit, bettersocial.others, chatcolor.use) and let players use `&` colour codes defined below.
#   3. Use BetterSocial placeholders in menus or holograms as needed (docs: https://github.com/AlonsoAliaga/BetterSocial/wiki/Placeholders).
# Downloads:
#   - BetterSocial: https://www.spigotmc.org/resources/83437/
#   - ChatColor+: https://www.spigotmc.org/resources/chatcolor-%E2%9C%A8-custom-patterns-%E2%9C%85-full-configurable.93186/
# AlonsoLeagues merge steps:
#   1. Install AlonsoLeagues (https://www.spigotmc.org/resources/92575/) on the same server and keep it synced via MySQL if you run multiple instances.
#   2. Make sure the identifiers under 'alonsoleagues.levels' match the IDs you configured in AlonsoLeagues' leagues.yml.
#   3. Customise the progress bar and description strings here; the plugin swaps in live data for {appearance}, {player}, {current}, {required}, {percent}, and {bar}.
#   4. Use AlonsoLeagues PlaceholderAPI placeholders (e.g. %alonsoleagues_league_displayname%) in scoreboards, menus or holograms for consistent data across the lobby.
