# Enable if this lobby is part of a BungeeCord network.
bungeecord: false
# API credentials used by the Zonely web panel (leave blank to disable remote commands).
web-token: ""
socket-port: 454
auction-server-id: 1
store:
  # false: Yalnızca bu sunucuya teslim eder. true: Panelde ürüne seçilen diğer sunuculara da gönderir.
  # Her sunucu, yukarıdaki kendine ait web-token ile otomatik eşleşir; sunucu numarası gerekmez.
  send-to-other-servers: false
  # Item/rank commands wait until the buyer joins the target server.
  require-player-online: true
# Toggle major subsystems individually.
modules:
  socket: true
  vouchers: true
  auctions: true
  reports: true
  last-credits: true
  support: true
  friends: true
  auth: false
  launcher-auth: false
  esports: true

# Support module settings
support:
  # When set to a value > 0 this category ID is always used for newly created tickets.
  # Set to -1 to automatically pick the first category returned by the web panel ordering.
  default-category-id: -1
  # Allow the support module to run even if the in-game auth module is disabled.
  allow-without-auth: false

# Friends module settings
friends:
  limits:
    # Maximum friends per player. Set 0 to disable the limit.
    max-friends: 150
    # Maximum pending outgoing friend requests. Set 0 to disable the limit.
    max-outgoing-pending: 25
  mailbox:
    # Poll interval for cross-server mailbox delivery (ticks).
    poll-ticks: 40
    # Maximum mailbox rows consumed per poll cycle.
    batch-size: 64
  # Time window for /friends remove <player> confirm (seconds).
  remove-confirm-seconds: 15
  message:
    # Maximum direct-message / announcement length.
    max-length: 256

database:
  # Supported drivers: MongoDB, MySQL
  type: "MySQL"
  # When true the plugin refuses to start until MySQL is fully configured and reachable.
  require-mysql: true
  # When true the plugin switches to an in-memory fallback if the database is unavailable.
  # Ignored when require-mysql is enabled.
  fail-open: false
  mysql:
    hikari: true
    mariadb: false
    host: "localhost"
    port: "3306"
    name: "test"
    username: "root"
    password: ""
  mongodb:
    url: ""
auth:
  password-policy:
    min-length: 6
    max-length: 32
    disallow-name-substring: true
  security:
    max-login-attempts: 5
    login-timeout-seconds: 120
    # Master switch for auto-login.
    auto-login-enabled: false
    # Legacy time-window mode (seconds). If > 0 and auto-login-enabled=true,
    # player can be auto-logged if the last login is within this window.
    auto-login-seconds: 0
    # IP-based mode. If true and auto-login-enabled=true, matching IP is enough
    # to restore session (time window is ignored).
    auto-login-by-ip: false
    # Require same IP for both time and IP auto-login modes.
    auto-login-require-same-ip: true
    title-verification:
      # Enable title-based code verification before /login and /register.
      enabled: false
      # Code length between 4 and 8.
      code-length: 5
      # Characters used while generating the code.
      code-charset: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
    allowed-commands:
      - login
      - l
      - register
      - reg
      - 2fa
      - twofactor
      - email
      - mail
      - passwordreset
      - passwordreset
  fallback-server:
    # Enables automatic transfer through BungeeCord after login/registration.
    enabled: false
    # Enter the server name exactly as it appears inside your BungeeCord config.
    server: "fallback"
    # Delay (in ticks) before the transfer request is dispatched. Useful when additional
    # join logic (bossbars, announcements, etc.) should finish first.
    connect-delay-ticks: 20
    # Plugin messaging channel to use. Leave as-is unless you renamed it on your proxy.
    channel: "bungeecord:main"
    # When true the module only runs if the global `bungeecord` flag is enabled in this file.
    require-bungeecord-flag: true
    trigger:
      # Send the player after a manual /login or /register flow completes.
      on-login: true
      # Send the player even when their session was auto-restored.
      on-session-restore: true
  site:
    base-url: "https://example.com"
    password-reset-path: "/recovery"
    twofactor-login-path: "/login"
    email-verify-path: "/mail/verify"
  two-factor:
    enabled: true
    issuer: "Zonely Network"
    digits: 6
    period-seconds: 30
    allowed-drift-windows: 1
    enforce-on-login: true
    setup-timeout-seconds: 300
    cooldown-seconds: 5
    require-code-to-disable: true
    recovery:
      enabled: true
      token-expiry-minutes: 60
  password-reset:
    enabled: true
    token-expiry-minutes: 60
  email:
    enabled: false
    require-address: true
    require-verification: true
    auto-send-token: true
    send-mail: true
    show-link-in-chat: true
    resend-cooldown-seconds: 300
    reminder-interval-seconds: 60
    allowed-domains: []
chat-bridge:
  enabled: true
  server-id: "lobby-1"
  poll-interval-seconds: 2
  command-batch-size: 25
  retention-days: 7
  activity:
    # User activity tracking for web stats (daily/weekly/monthly graphs).
    enabled: true
    # Flush online playtime to MySQL every N seconds.
    flush-interval-seconds: 60
    # Keep per-day and recent activity rows for this many days.
    retention-days: 30
    # Track chat and command events into activity tables.
    track-chat: true
    track-commands: true
inventory-snapshot:
  enabled: true
  server-id: ""
  remove-on-join: true
booster:
  minigames:
    - "Lobby"
queue: true
gold: true
punishments:
  enabled: true
  allow:
    ban: true
    mute: true
    warning: true
  history:
    page-size: 10
  default-reason: "Not specified"
chat-filter:
  profanity:
    enabled: true
    blocked-words:
      - "fuck"
      - "wtf"
    mute-durations:
      - "5m"
      - "15m"
      - "1h"
  advertising:
    enabled: true
    mute-duration: "3d"
  keywords:
    - "http://"
    - "https://"
    - "www."
launcher-auth:
  base-url: "https://zonely.gen.tr"
  api-token: ""
  timeout-ms: 4500
  fail-open: true
  log-denied: true
  # When true, connections from 127.0.0.1/::1 are automatically accepted (useful for local testing).
  allow-loopback: false
esports:
  enabled: true
  refresh-seconds: 20
  scoreboard:
    # Base scoreboard title used when custom frames are not provided.
    title-base: "&e&lE-SPORTS"
    # Optional palette used by animated title generation.
    title-palette:
      - "&e"
      - "&6"
      - "&f"
      - "&6"
    # Set explicit animation frames (leave empty to auto-generate from base + palette).
    title-frames: []
  auto-start:
    enabled: false
    # Minutes after scheduled start to auto-start if no staff online
    delay-minutes: 10
  replay:
    # Kulup-vs-kulup mac replay kaydi (2 oyuncu ozel degil).
    enabled: true
    # Match basina tutulacak maksimum event sayisi.
    max-events-per-match: 2400
    # Asenkron DB flush batch boyutu.
    flush-batch-size: 200
    # Ayni hasar tipinde tekrar kayitlar arasindaki min sure.
    damage-event-min-interval-ms: 250
    # Cevresel hasar eventlerini dahil et (lava/fall vb).
    include-environment-damage: false
    # JSON string alanlarinin maksimum uzunlugu.
    max-string-length: 180
    # Koordinat yuvarlama hassasiyeti.
    location-decimals: 2
    # Yazma kuyrugu ust limiti.
    max-queue-size: 9000
    # Match replay_url alanini otomatik guncelle.
    update-match-replay-url: false
  arena:
    spectator:
      world: "world"
      x: 0.5
      y: 85.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0
    countdown-seconds: 5
    staging-border-radius: 8.0
    border-radius: 35.0
    border-growth-seconds: 6
    spawn-autofill-radius: 6.0
reports:
  default-punishment:
    duration: "1d"
  chat-evidence:
    # Number of latest chat lines captured when a report is created.
    max-lines: 6
  replay:
    # How long actions are recorded after report creation.
    capture-seconds: 120
    # Nearby player tracking radius for action capture (blocks).
    capture-radius: 25.0
    # Initial world surface snapshot so web replay can render nearby map chunks.
    chunk-capture:
      enabled: true
      # Captures a square around report center: (radius*2+1)^2 chunks.
      radius-chunks: 4
      # Hard cap to avoid oversized reports on very busy maps.
      max-chunks: 256
      # While tracked players move into new chunks, capture nearby chunk surfaces too.
      follow-player: true
      # Additional square radius captured around the player's current chunk while moving.
      follow-radius-chunks: 2
      # Refresh nearby chunks periodically even if the player stays in the same chunk.
      follow-refresh-ticks: 100
      # Force an extra chunk capture around block place/break events.
      capture-on-block-events: true
      # Extra square radius captured around place/break events.
      block-event-radius-chunks: 1
      # Keep true for performance; false can force-load missing chunks.
      loaded-only: true
      # Compress chunk surface payload before DB write.
      gzip: true
  punishment:
    defaults:
      ban-duration: "1d"
      mute-duration: "30m"
  notifications:
    approve-commands:
      enabled: false
      list:
        - "tell {reporter} Your report #{id} resulted in {action}"
